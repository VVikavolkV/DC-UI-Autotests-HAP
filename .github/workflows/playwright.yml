# .github/workflows/playwright.yml
name: Playwright Tests
on:
  push:
    branches: [ main, master ] # Запускать при пуше в ветки main или master
  pull_request:
    branches: [ main, master ] # Запускать при создании Pull Request в эти ветки

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Используем виртуальную машину с Ubuntu
    steps:
    - uses: actions/checkout@v4 # 1. Скачиваем твой код из репозитория
    - uses: actions/setup-node@v4 # 2. Устанавливаем Node.js
      with:
        node-version: lts/*
    - name: Install dependencies # 3. Устанавливаем зависимости (npm-пакеты)
      run: npm ci
    - name: Install Playwright Browsers # 4. Устанавливаем браузеры для Playwright
      run: npx playwright install --with-deps
    - name: Run Playwright tests # 5. Запускаем тесты!
      run: npx playwright test
    - name: Upload report # 6. Сохраняем HTML-отчёт (об этом ниже)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30